# The same manifest with the changes a reviewer must be able to see even with
# masking on: a replica jump, an image bump, and privileged flipped to true.
# The Secret's values change too, and those must stay masked.
kind: Deployment
metadata:
    name: token-service
    namespace: prod
spec:
    replicas: 9
    template:
        spec:
            containers:
                - name: api
                  image: registry/api:1.1.0
                  securityContext:
                      privileged: true
---
kind: Service
metadata:
    name: api
    namespace: prod
spec:
    type: LoadBalancer
---
kind: Secret
metadata:
    name: db
    namespace: prod
data:
    password: bm90LWEtcmVhbC1uZXctcGFzc3dvcmQ=
stringData:
    token: not-a-real-rotated-token
