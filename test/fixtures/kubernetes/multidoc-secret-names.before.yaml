# A manifest whose Deployment is *named* `token-service`. The name is user data
# and says nothing about whether the values inside are secrets; the Secret in
# the third document is where the actual credentials live.
kind: Deployment
metadata:
    name: token-service
    namespace: prod
spec:
    replicas: 2
    template:
        spec:
            containers:
                - name: api
                  image: registry/api:1.0.0
                  securityContext:
                      privileged: false
---
kind: Service
metadata:
    name: api
    namespace: prod
spec:
    type: ClusterIP
---
kind: Secret
metadata:
    name: db
    namespace: prod
data:
    password: bm90LWEtcmVhbC1wYXNzd29yZA==
stringData:
    token: not-a-real-token
