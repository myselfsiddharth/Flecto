# Rendered from the same chart after an ordinary release: version bump, a modest
# scale-out, a config tweak, a rotated placeholder secret, a widened autoscaler,
# and one new hardened workload. Nothing here is a `kubernetes` pack finding.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: prod
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: api
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: prod
type: Opaque
data:
  # Placeholder values only — never a real credential in a fixture.
  database-password: ZmFrZTI=
  session-key: ZmFrZQ==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: prod
data:
  LOG_LEVEL: debug
  FEATURE_BILLING: "true"
  FEATURE_EXPORTS: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: prod
  labels:
    app.kubernetes.io/name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/version: 1.4.3
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/acme/api:1.4.3
          imagePullPolicy: IfNotPresent
          command:
            - /app/migrate
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: api
          image: ghcr.io/acme/api:1.4.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: debug
            - name: FEATURE_EXPORTS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
          resources:
            limits:
              cpu: 750m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 150m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 4
  maxReplicas: 40
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
  namespace: prod
  labels:
    app.kubernetes.io/name: exporter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exporter
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/acme/exporter:0.9.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exporter
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
