# `multidoc.before.yaml` after `sops updatekeys` added a second age recipient at
# the *front* of the encrypted document's key list. Nothing else changed: the
# data key is the same, so every ENC[...] value and the MAC are byte-identical.
kind: ConfigMap
metadata:
    name: billing-config
    namespace: prod
data:
    region: eu-west-1
    pool_size: "10"
---
kind: Secret
metadata:
    name: billing
    namespace: prod
data:
    dsn: ENC[AES256_GCM,data:ZmFrZTA=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    hc_vault: []
    age:
        - recipient: age1newcomernewcomernewcomernewcomernewcomernewcomer000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZW5ld2NvbWVyZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
        - recipient: age1exampleexampleexampleexampleexampleexampleexample000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-01-04T10:15:00Z"
    mac: ENC[AES256_GCM,data:bWFjMA==,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    encrypted_regex: ^(dsn)$
    version: 3.9.0
