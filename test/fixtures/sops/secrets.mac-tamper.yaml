# Byte-for-byte `secrets.before.yaml` except for the MAC. A real edit moves the
# MAC *and* something it covers, so a MAC on its own is the tamper signal.
service: billing-api
replicas: 3
database:
    host: db.internal
    username: ENC[AES256_GCM,data:ZmFrZQ==,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    password: ENC[AES256_GCM,data:ZmFrZTA=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
api:
    key: ENC[AES256_GCM,data:ZmFrZTE=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    hc_vault: []
    age:
        - recipient: age1exampleexampleexampleexampleexampleexampleexample000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-01-04T10:15:00Z"
    mac: ENC[AES256_GCM,data:dGFtcGVy,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    pgp:
        - created_at: "2026-01-04T10:15:00Z"
          enc: |
            -----BEGIN PGP MESSAGE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END PGP MESSAGE-----
          fp: FAKE0000000000000000000000000000FAKE0001
    encrypted_regex: ^(username|password|key)$
    version: 3.9.0
