# The shape Kubernetes secrets actually ship in: several documents in one file,
# only some of them encrypted. The plain ConfigMap comes first so the `sops`
# block is nowhere near the root of the parsed tree. Every ciphertext,
# recipient, and fingerprint below is fake and decrypts to nothing.
kind: ConfigMap
metadata:
    name: billing-config
    namespace: prod
data:
    region: eu-west-1
    pool_size: "10"
---
kind: Secret
metadata:
    name: billing
    namespace: prod
data:
    dsn: ENC[AES256_GCM,data:ZmFrZTA=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    hc_vault: []
    age:
        - recipient: age1exampleexampleexampleexampleexampleexampleexample000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-01-04T10:15:00Z"
    mac: ENC[AES256_GCM,data:bWFjMA==,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    encrypted_regex: ^(dsn)$
    version: 3.9.0
