# `secrets.before.yaml` after `sops updatekeys` added a second age recipient
# at the *front* of the list. Nothing else about the file changed: the data key
# is the same, so every ENC[...] value and the MAC are byte-identical.
service: billing-api
replicas: 3
database:
    host: db.internal
    username: ENC[AES256_GCM,data:ZmFrZQ==,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    password: ENC[AES256_GCM,data:ZmFrZTA=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
api:
    key: ENC[AES256_GCM,data:ZmFrZTE=,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    hc_vault: []
    age:
        - recipient: age1newcomernewcomernewcomernewcomernewcomernewcomer000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZW5ld2NvbWVyZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
        - recipient: age1exampleexampleexampleexampleexampleexampleexample000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-01-04T10:15:00Z"
    mac: ENC[AES256_GCM,data:bWFjMA==,iv:ZmFrZQ==,tag:ZmFrZQ==,type:str]
    pgp:
        - created_at: "2026-01-04T10:15:00Z"
          enc: |
            -----BEGIN PGP MESSAGE-----
            ZmFrZWZha2VmYWtlZmFrZQ==
            -----END PGP MESSAGE-----
          fp: FAKE0000000000000000000000000000FAKE0001
    encrypted_regex: ^(username|password|key)$
    version: 3.9.0
