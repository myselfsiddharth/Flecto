name: CI
on:
  pull_request_target:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions: write-all
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@main
        with:
          ref: github.event.pull_request.head.sha
      - run: echo ${{ secrets.DEPLOY_TOKEN }}
