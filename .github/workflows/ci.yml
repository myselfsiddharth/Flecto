name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Platform divergence is the point of this matrix, so one platform failing
      # must not cancel the runners that would show whether it is platform-wide.
      fail-fast: false
      matrix:
        # The Node matrix runs on Linux; Windows and macOS run one version each.
        # Repeating every Node version on all three platforms triples the cost to
        # re-test a runtime difference the Linux jobs already cover -- what the
        # extra platforms add is the OS, not the runtime.
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          # Windows: fast-glob separator handling, ReadDirectoryChangesW watch
          # events, and CRLF checkouts.
          - os: windows-latest
            node-version: 24
          # macOS: chokidar takes the fsevents path here rather than inotify,
          # and this is where most local development happens.
          - os: macos-latest
            node-version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run pack:check
